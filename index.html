<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moja strona</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
        }

        main {
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .przycisk {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .przycisk:hover {
            background: #0056b3;
        }

        footer {
            margin-top: 100px;
            padding: 20px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Witaj na mojej stronie</h1>
    </header>

    <main>
        <h2>Moja pierwsza strona na GitHub Pages</h2>

        <p>
            To jest podstawowa strona HTML.
        </p>

        <a href="https://www.google.com" class="przycisk">
            Kliknij tutaj
        </a>
    </main>

    <footer>
        © 2026 Moja strona
    </footer>

</body>
</html>
