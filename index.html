```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Znajdź nas w social mediach</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111111, #252525);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;

            border-radius: 50%;
            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #111;
            font-size: 22px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .description {
            margin: 0 0 30px;
            color: #cccccc;
            font-size: 16px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 60px;

            margin-bottom: 15px;

            border-radius: 14px;

            text-decoration: none;
            color: white;

            font-size: 18px;
            font-weight: bold;

            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .social-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );
        }

        .facebook {
            background: #1877f2;
        }

        .youtube {
            background: #ff0000;
        }

        .tiktok {
            background: #000000;
            border: 1px solid #444;
        }

        .icon {
            margin-right: 10px;
            font-size: 23px;
        }

        .footer {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- LOGO / NAZWA -->
        <div class="logo">
            LOGO
        </div>

        <h1>Znajdź nas w social mediach</h1>

        <p class="description">
            Obserwuj nas i bądź na bieżąco!
        </p>


        <!-- INSTAGRAM -->
        <a
            class="social-button instagram"
            href="https://www.instagram.com/TWOJ_PROFIL/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">📸</span>
            Instagram
        </a>


        <!-- FACEBOOK -->
        <a
            class="social-button facebook"
            href="https://www.facebook.com/TWOJ_PROFIL/"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">f</span>
            Facebook
        </a>


        <!-- YOUTUBE -->
        <a
            class="social-button youtube"
            href="https://www.youtube.com/@TWOJ_KANAL"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">▶</span>
            YouTube
        </a>


        <!-- TIKTOK -->
        <a
            class="social-button tiktok"
            href="https://www.tiktok.com/@TWOJ_PROFIL"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span class="icon">♪</span>
            TikTok
        </a>


        <div class="footer">
            © 2026 Twoja firma
        </div>

    </main>

</body>
</html>
